name: Deploy ADMISK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npx ng build --configuration production --base-href /Admisk/

      - name: Inspect build output
        run: |
          echo "Searching for Angular index.html:"
          find dist -maxdepth 5 -type f -name index.html -print

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/admisk/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4