name: Deploy ADMISK to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Angular build
        run: |
          test -f dist/admisk-website/browser/index.html || {
            echo "ERROR: Angular index.html not found."
            exit 1
          }

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/admisk-website/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
